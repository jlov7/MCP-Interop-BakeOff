services:
  api:
    build: .
    command: uv run usb-agents serve --host 0.0.0.0 --port 8765
    ports:
      - "8765:8765"
    volumes:
      - ./.usb-agents:/app/.usb-agents
  web:
    build: .
    command: pnpm --filter @usb-agents/web dev --hostname 0.0.0.0
    environment:
      USB_AGENTS_API_URL: http://api:8765
    ports:
      - "3000:3000"
    depends_on:
      - api
