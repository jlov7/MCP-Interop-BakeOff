[project]
name = "usb-agents"
version = "0.1.0"
description = "MCP interop bake-off harness for OpenAI, Microsoft, and Mistral agent runtimes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "jsonschema>=4.21.1",
  "click>=8.1.0",
  "openai>=1.30.0",
  "azure-core>=1.30.0",
  "mistralai>=0.4.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp>=1.25.0",
  "opentelemetry-instrumentation>=0.46b0",
  "pyyaml>=6.0.0",
  "jinja2>=3.1.0",
  "anyio>=4.3.0",
  "typer>=0.12.3",
  "pyflakes>=3.2.0",
]

[project.scripts]
usb-agents = "usb_agents.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "types-jsonschema>=4.23.0.20241208",
  "types-PyYAML>=6.0.12.20240917",
]

[project.urls]
homepage = "https://github.com/jlov7/MCP-Interop-BakeOff"
repository = "https://github.com/jlov7/MCP-Interop-BakeOff"
issues = "https://github.com/jlov7/MCP-Interop-BakeOff/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".usb-agents",
  ".venv",
  "metrics_archive",
  "traces",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-q --disable-warnings"
pythonpath = [
  "src",
  "."
]
testpaths = [
  "tests"
]

[tool.mypy]
python_version = "3.10"
strict = false
explicit_package_bases = true
mypy_path = "src"
exclude = [
  "^apps/",
  "^metrics_archive/",
  "^scripts/",
  "^tasks/",
  "^tests/",
  "^traces/",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "eval*",
  "mcp_server*",
  "runners*",
  "usb_agents*",
  "usb_agents_api*",
  "usb_agents_mcp*",
]

[tool.setuptools.package-data]
eval = ["taxonomy.json"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
