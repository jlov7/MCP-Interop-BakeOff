name: Feature request
description: Propose a product, protocol, adapter, or verification improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow or quality gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - MCP protocol
        - Runtime adapter
        - Transport adapter
        - Frontend console
        - Metrics and regressions
        - Security
        - Documentation
        - CI and release
    validations:
      required: true
